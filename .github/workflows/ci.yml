name: Tare checks
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: npm ci --prefix graph/subgraph --ignore-scripts --no-audit --no-fund
      - run: node --run build:subgraph
  confidential-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix workflows/cre --ignore-scripts --no-audit --no-fund
      - run: node --run verify:cre
      - run: npm run compile --prefix workflows/cre
      - run: docker run --rm --user 0:0 --entrypoint forge -v "$PWD:/work" -w /work/contracts ghcr.io/foundry-rs/foundry:v1.3.1 test
  graph-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: node --run build
      - run: npm ci --prefix graph/subgraph --ignore-scripts --no-audit --no-fund
      - run: node --run build:subgraph
      - run: docker compose -f graph/integration/compose.yaml up -d
      # The image's foundry user cannot write the runner-owned Linux bind mount.
      - run: docker run --rm --user 0:0 --entrypoint forge -v "$PWD/graph/integration:/work" -w /work ghcr.io/foundry-rs/foundry:v1.3.1 build
      - run: node --run test:graph
      - if: failure()
        run: docker compose -f graph/integration/compose.yaml logs --tail 100
      - if: always()
        run: docker compose -f graph/integration/compose.yaml down --volumes
